name: Software Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and API tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-linux.lock
      - run: python -m pip install -r requirements-test.txt -c requirements-linux.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  browser:
    name: Desktop and mobile tutor integration (mocked Groq)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-linux.lock
            requirements-browser-test.txt
      - run: python -m pip install -r requirements-test.txt -r requirements-browser-test.txt -c requirements-linux.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.verify_assistant --channel chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-assistant-browser-checks
          path: data/assistant-verification/
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: Build and test CPU container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build --tag document-assistant:ci .
      - name: Run tests inside the non-root container without network access
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=128m
          --mount type=bind,source="$PWD/tests",target=/app/tests,readonly
          --mount type=bind,source="$PWD/scripts",target=/app/scripts,readonly
          --mount type=bind,source="$PWD/evaluation",target=/app/evaluation,readonly
          document-assistant:ci python -m unittest discover -s tests -v
      - name: Check default web startup and health endpoint
        run: |
          docker run --detach --name assistant-ci --publish 127.0.0.1:8766:8765 document-assistant:ci
          trap 'docker rm --force assistant-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/api/health; then
              curl --fail --silent http://127.0.0.1:8766/ > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs assistant-ci
          exit 1
